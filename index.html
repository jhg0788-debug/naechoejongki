function notify(){clearTimeout(notifyT);notifyT=setTimeout(()=>subs.slice().forEach(s=>{try{s.fire()}catch(e){console.error(e)}}),30)}
const setStatus=t=>{const el=document.getElementById("status");if(el)el.textContent=t};
let owner=false;

async function loadAll(){
  const fresh={};let from=0;const N=1000;
  for(;;){const{data,error}=await sb.from("cb_docs").select("coll,id,data").order("coll").order("id").range(from,from+N-1);
    if(error)throw error;data.forEach(r=>{(fresh[r.coll]=fresh[r.coll]||{})[r.id]=r.data});if(data.length<N)break;from+=N}
  if(owner){const{data}=await sb.rpc("cb_contracts",{p_pin:pin});if(data)(fresh.admin=fresh.admin||{}).contracts=data}
  for(const k of Object.keys(store))delete store[k];Object.assign(store,fresh);
}
async function checkPin(p){if(!p)return"not_granted";const{data,error}=await sb.rpc("cb_check",{p_pin:p});if(error)return"error";return data}
async function refreshContracts(){if(!owner)return;const{data}=await sb.rpc("cb_contracts",{p_pin:pin});if(data){col("admin").contracts=data;notify()}}

const ready=(async()=>{
  if(pin){const r=await checkPin(pin);owner=r==="ok";if(r==="not_granted"){try{localStorage.removeItem(PIN_KEY)}catch(e){}}}
  for(let i=0;;i++){try{await loadAll();break}catch(e){setStatus("서버에 연결하는 중… 인터넷을 확인해 주세요");await new Promise(r=>setTimeout(r,Math.min(15000,1500*(i+1))))}}
  setStatus("실시간 연결됨");
  sb.channel("cb_docs_live").on("postgres_changes",{event:"*",schema:"public",table:"cb_docs"},p=>{
    if(p.eventType==="DELETE"){const o=p.old||{};if(o.coll&&store[o.coll])delete store[o.coll][o.id]}
    else{const n=p.new;if(n&&n.coll)col(n.coll)[n.id]=n.data}
    notify();
  }).subscribe(s=>{if(s==="SUBSCRIBED")setStatus("실시간 연결됨");else if(s==="CHANNEL_ERROR"||s==="TIMED_OUT"||s==="CLOSED")setStatus("다시 연결하는 중…")});
  /* safety net: re-sync every 45s and whenever the screen comes back */
  const resync=async()=>{try{await loadAll();notify()}catch(e){}};
  setInterval(resync,45000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)resync()});
  addEventListener("online",resync);
})();

async function call(fn,args,isAdmin){
  const{data,error}=await sb.rpc(fn,{...args,p_pin:isAdmin?pin:null});
  if(error)throw{code:"network",message:error.message};
  if(data!=="ok")throw{code:data||"error"};
}
const docSnap=(id,d)=>({id,exists:!!d,data:()=>clone(d),metadata:{fromCache:false}});
function query(c,fs){
  const run=()=>{const docs=Object.entries(col(c)).filter(([id,d])=>fs.every(([k,v])=>d[k]===v)).map(([id,d])=>docSnap(id,d));return{docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false}}};
  return{
    where(k,op,v){return query(c,[...fs,[k,v]])},
    get:async()=>{await ready;return run()},
    onSnapshot(next,err){const s={fire:()=>next(run())};subs.push(s);ready.then(()=>s.fire());return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}},
    doc:id=>ref(c+"/"+id),
    add:async(data)=>{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);await call("cb_set",{p_coll:c,p_id:id,p_data:data},c==="admin");col(c)[id]=clone(data);notify();return{id}}
  };
}
function ref(p){const i=p.indexOf("/"),c=p.slice(0,i),id=p.slice(i+1),adm=c==="admin";
  return{
    get:async()=>{await ready;return docSnap(id,col(c)[id])},
    set:async(d)=>{await call("cb_set",{p_coll:c,p_id:id,p_data:d},adm);col(c)[id]=clone(d);notify();if(adm&&id==="contracts")refreshContracts()},
    update:async(d)=>{await call("cb_merge",{p_coll:c,p_id:id,p_patch:d},adm);if(col(c)[id])merge(col(c)[id],d);notify();if(adm&&id==="contracts")refreshContracts()},
    delete:async()=>{await call("cb_delete",{p_coll:c,p_id:id},adm);delete col(c)[id];notify()},
    onSnapshot(next){const s={fire:()=>next(docSnap(id,col(c)[id]))};subs.push(s);ready.then(()=>s.fire());return()=>{const k=subs.indexOf(s);if(k>=0)subs.splice(k,1)}}
  }}
const db={collection:c=>query(c,[]),doc:ref};
const user={isOwner:async()=>{await ready;return owner},canEdit:async()=>true,id:async()=>"web",me:async()=>({id:"web"})};
const downloads={save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));a.download=filename;document.body.appendChild(a);a.click();a.remove();return{status:"saved"}}};
window.claude={use:async n=>n==="db"?db:n==="user"?user:n==="downloads"?downloads:null};
window.__noAI=true;
/* boss login / logout / PIN change, used by the page */
window.__boss={
  login:async p=>{const r=await checkPin(p);if(r==="ok"){pin=p;try{localStorage.setItem(PIN_KEY,p);localStorage.setItem("me","대표");localStorage.setItem("guide1","1")}catch(e){}}return r},
  logout:()=>{try{localStorage.removeItem(PIN_KEY);localStorage.removeItem("me")}catch(e){}location.reload()},
  changePin:async(o,n)=>{const{data,error}=await sb.rpc("cb_set_pin",{p_old:o,p_new:n});if(error)return"network";if(data==="ok"){pin=n;try{localStorage.setItem(PIN_KEY,n)}catch(e){}}return data},
  isOwner:()=>owner
};
})();

function norm(n){n=n.trim().replace(/\s+/g,"");const k=n.toLowerCase();return ALIAS[k]||ALIAS[n]||n}
function cid(name){return "c_"+[...new TextEncoder().encode(name)].map(b=>b.toString(16).padStart(2,"0")).join("")}
function shiftMonth(m,d){let[y,mo]=m.split("-").map(Number);mo+=d;while(mo<1){mo+=12;y--}while(mo>12){mo-=12;y++}return y+"-"+String(mo).padStart(2,"0")}
function dayDiff(a,b){return Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5)}
function monthEnd(m){const[y,mo]=m.split("-").map(Number);return `${m}-${String(new Date(y,mo,0).getDate()).padStart(2,"0")}`}
function daysLeft(){const cur=today.slice(0,7);if(month<cur)return -1;if(month>cur)return 99;return dayDiff(today,monthEnd(month))}
function dlOf(it){return it.deadline?dayDiff(today,it.deadline):null}
function state(it){if(it.done>=it.target)return"done";if(it.waiting)return"wait";const d=dlOf(it);if(d!==null&&d<0)return"danger";const dl=daysLeft();if(dl<0)return"danger";if(dl<=7&&it.done/it.target<.5)return"danger";return"wait"}

function wraw(a,b){let n=0,d=a;while(d<=b){const w=new Date(d+"T00:00").getDay();if(w!==0&&w!==6)n++;d=addDays(d,1)}return n}
/* working days: weekdays minus company holidays (and the person's own days off when who is given) */
function wdays(a,b,who){let n=0,d=a;while(d<=b){const w=new Date(d+"T00:00").getDay();if(w!==0&&w!==6&&!isOff(d,who))n++;d=addDays(d,1)}return n}
async function upsert(path,data,exists){if(exists)return db.doc(path).update(data);return db.doc(path).set(data)}
const wcache={};
function weeksOf(m){if(wcache[m])return wcache[m];const e=monthEnd(m);let out=[],cur=m+"-01";
  while(cur<=e){const dow=(new Date(cur+"T00:00").getDay()+6)%7;let end=addDays(cur,6-dow);if(end>e)end=e;out.push({start:cur,end});cur=addDays(end,1)}
  if(out.length>1&&!wraw(out[0].start,out[0].end)){out[1].start=out[0].start;out.shift()}

  return wcache[m]=out}
function defaultWeek(){const W=weeksOf(month),cur=today.slice(0,7);if(month<cur)return W.length-1;if(month>cur)return 0;const i=W.findIndex(w=>today>=w.start&&today<=w.end);return i<0?0:i}

function expBy(it,date){const s=month+"-01",tot=wdays(s,monthEnd(month))||1;return Math.min(it.target,Math.ceil(it.target*wdays(s,date)/tot))}

  const before=Math.max(0,it.done-wDone);return{wDone,wT:Math.max(0,expBy(it,w.end)-before)}}

/* ---- staff stats ---- */
function staffStats(){
  const s={};STAFF.forEach(([n])=>s[n]={month:0,today:0,praise:0,days:new Set()});
  const w=period==="week"?curW():null;
  logs.forEach(l=>{const p=s[l.by];if(!p||l.voided)return;if(!w||(l.date>=w.start&&l.date<=w.end))p.month+=l.delta;if(l.date===today)p.today+=l.delta;if(l.praise)p.praise++;if(pos(l))p.days.add(l.date)});
  adlogs.forEach(l=>{const p=s[l.by];if(!p||l.voided||l.kind!=="check")return;if(!w||(l.date>=w.start&&l.date<=w.end))p.month++;if(l.date===today)p.today++;p.days.add(l.date)});
  for(const n in s){let k=0,d=today;for(let i=0;i<40;i++){const dt=new Date(d+"T00:00");const wd=dt.getDay();if(wd!==0&&wd!==6){if(s[n].days.has(d))k++;else if(d!==today)break}dt.setDate(dt.getDate()-1);d=dt.toLocaleDateString("sv-SE")}s[n].streak=k}
  const top=Math.max(...Object.values(s).map(p=>p.month));
  return {s,mvp:top>0?Object.keys(s).filter(n=>s[n].month===top):[]};
}

  const[,m]=month.split("-"),w=curW();const ns=items.map(i=>({i,...nums(i)}));
  const wt=ns.reduce((a,b)=>a+b.t,0),wd=ns.reduce((a,b)=>a+Math.min(b.d,b.t),0),mt=items.reduce((a,b)=>a+b.target,0),md=items.reduce((a,b)=>a+Math.min(b.done,b.target),0);
  const L=[`📅 ${Number(m)}월 ${wk+1}주차 (${fmtD(w.start)}~${fmtD(w.end)}) | ${fmtD(today)} 기준 | 작성: ${isStaff(me)?nick(me):me}`,`주간 ${wd}/${wt}건 (${wt?Math.round(wd/wt*100):100}%) · 월 누계 ${md}/${mt}건 (${mt?Math.round(md/mt*100):0}%)`,""];
  const open=ns.filter(n=>n.d<n.t);
  if(open.length){L.push("⚠️ 이번 주 남은 것");for(const[k,v]of CH){const l=open.filter(n=>n.i.ch===k);if(l.length)L.push(`[${v}] `+l.map(n=>`${n.s==="danger"?"🔴":""}${n.i.client} ${n.d}/${n.t}${n.i.memo?` - ${n.i.memo}`:""}`).join(" · "))}L.push("")}
  const did=ns.filter(n=>n.d>0);
  if(did.length){L.push("✅ 이번 주 처리");for(const[k,v]of CH){const l=did.filter(n=>n.i.ch===k);if(l.length)L.push(`[${v}] `+l.map(n=>`${n.i.client} ${n.d}`).join(" · "))}}
  else L.push("✅ 이번 주 처리 아직 없음");
  const op=tasks.filter(t=>t.status!=="done"),dw=tasks.filter(t=>t.status==="done"&&t.doneAt&&new Date(t.doneAt).toLocaleDateString("sv-SE")>=w.start&&new Date(t.doneAt).toLocaleDateString("sv-SE")<=w.end);
  if(op.length||dw.length){L.push("","🎬 제작");
    if(dw.length)L.push("완료: "+dw.map(t=>`${t.client?t.client+" ":""}${t.title}`).join(" · "));
    const rv=op.filter(t=>t.status==="review"),cf=op.filter(t=>t.status==="confirm"),dg=op.filter(t=>t.status==="todo"||t.status==="doing");

    if(cf.length)L.push("업체 컨펌 대기: "+cf.map(t=>t.title).join(" · "));
    if(dg.length)L.push("진행/요청: "+dg.map(t=>`${t.due&&t.due<today?"🔴":""}${t.title}${t.due?` (${fmtD(t.due)})`:""}`).join(" · "))}
  const t=Object.entries(td).filter(([,d])=>d);
  if(t.length){const s=t.reduce((a,[,d])=>a+d,0);L.push("",`🔺 오늘 ${s>=0?"+":""}${s} (`+t.map(([id,d])=>{const it=items.find(i=>i.id===id);return it?`${it.client} ${CHN[it.ch]} ${d>0?"+":""}${d}`:""}).filter(Boolean).join(", ")+")")}
  const pr=logs.filter(l=>l.praise&&l.praisedOn===today);if(pr.length){const c={};pr.forEach(l=>c[l.by]=(c[l.by]||0)+1);L.push(`👏 오늘 대표님 칭찬: `+Object.entries(c).map(([n,k])=>`${n} ${k}`).join(", "))}
  return L.join("\n");
}

async function bump(id,d,origin){
  const it=items.find(i=>i.id===id);if(!it||!db)return;const nd=Math.max(0,it.done+d);if(nd===it.done)return;
  busy.add(id);render();
  const fin=nd>=it.target&&it.done<it.target,unfin=nd<it.target&&it.completedAt;
  try{await db.doc("items/"+id).update({done:nd,by:me,updatedAt:Date.now(),...(fin?{completedAt:Date.now()}:{}),...(unfin?{completedAt:null}:{}),...(d>0&&!it.startedAt?{startedAt:Date.now()}:{})});
    if(d>0){const ref=await db.collection("logs").add({month,date:today,item:id,client:it.client,ch:it.ch,delta:1,by:me,at:Date.now()});lastLog={item:id,log:ref.id}}
    else{const mine=logs.filter(l=>l.item===id&&pos(l)&&!l.voided).sort((a,b)=>b.at-a.at)[0];if(mine)await db.doc("logs/"+mine.id).update({voided:true});await db.collection("logs").add({month,date:today,item:id,client:it.client,ch:it.ch,delta:-1,by:me,at:Date.now(),voided:true});lastLog=null}
    if(d>0){miniBurst(origin);popLine(fin?`${it.client} ${CHN[it.ch]} 끝! 🎉`:null)}
  }catch(e){fail(e)}
  busy.delete(id);render();
}

    try{await db.collection("ads").add({client,media:m,status:"live",owner:$("#ad-owner").value,memo:$("#ad-memo").value.trim(),...(m==="review"?{recruit:n,sel:0,done:0}:{budget:n}),spent:{},lastCheck:Date.now(),by:me,createdAt:Date.now(),updatedAt:Date.now()});toast(`${client} ${AMN[m]} 광고를 추가했습니다`);adF=m;render()}catch(err){fail(err)}return}
  if(e.target.id==="goalform"){e.preventDefault();const v=parseInt($("#goalv").value,10);if(!(v>0))return toast("목표를 만 원 단위로 넣어주세요");try{await db.doc("admin/team").update({goal:v*10000});toast("월 목표를 저장했습니다")}catch(err){fail(err)}return}
  if(e.target.id==="pinform"){e.preventDefault();const o=$("#pin-old").value.trim(),n=$("#pin-new").value.trim();if(!/^[0-9]{6,12}$/.test(n))return toast("새 PIN은 숫자 6~12자리로 해주세요");
    const r=await window.__boss.changePin(o,n);toast(r==="ok"?"PIN을 바꿨어요. 다른 기기는 새 PIN으로 다시 로그인해 주세요":r==="locked"?"너무 많이 틀려서 15분 동안 잠겼어요.":r==="not_granted"?"지금 PIN이 맞지 않아요.":"바꾸지 못했어요. 다시 시도해 주세요");if(r==="ok")e.target.reset();return}
  if(e.target.id==="dailyform"){e.preventDefault();try{await submitDaily()}catch(err){fail(err)}return}
  if(e.target.id==="taskform"){e.preventDefault();const title=$("#tk-title").value.trim();if(!title)return;
    try{await db.collection("tasks").add({type:$("#tk-type").value,title,client:$("#tk-client").value.trim()?norm($("#tk-client").value):"",owner:$("#tk-owner").value,due:$("#tk-due").value||"",memo:$("#tk-memo").value.trim(),...($("#tk-done").checked?{status:"done",doneAt:Date.now(),startedAt:Date.now()}:{status:"todo"}),by:me,createdAt:Date.now(),updatedAt:Date.now()});if($("#tk-done").checked){popLine(POP[Math.floor(Math.random()*POP.length)]);miniBurst(null)}else toast("제작 요청을 추가했습니다")}catch(err){fail(err)}return}
  if(e.target.id==="msgform"){e.preventDefault();const to=$("#msgto").value,text=$("#msgtx").value.trim();if(!text)return;
    try{await db.doc("admin/team").update({msgs:{[to]:{text,at:Date.now(),on:today}}});toast(to==="all"?"전체에게 보냈습니다":`${nick(to)}님에게 보냈습니다`);$("#msgtx").value=""}catch(err){fail(err)}return}
  if(e.target.id==="nickform"){e.preventDefault();const n=e.target.dataset.name,v=$("#nk").value.trim().slice(0,12);if(!v)return;
    try{await db.doc("settings/team").update({nicks:{[n]:v}});toast(`이제 "${v}"입니다`);$("#cheer").hidden=true}catch(err){fail(err)}return}
});
document.addEventListener("click",e=>{const f=e.target.closest("[data-tf]");if(f){tFilter=f.dataset.tf;render()}const af=e.target.closest("[data-adf]");if(af){adF=af.dataset.adf;render()}});
$("#tabs").onclick=e=>{const b=e.target.closest("[data-view]");if(b){view=b.dataset.view;openId=null;render()}};
$("#prev").onclick=()=>{month=shiftMonth(month,-1);wk=null;subscribe()};
$("#next").onclick=()=>{month=shiftMonth(month,1);wk=null;subscribe()};
$("#period").onclick=e=>{const p=e.target.closest("[data-period]"),w=e.target.closest("[data-wk]");
  if(p){period=p.dataset.period;try{localStorage.setItem("period",period)}catch(_){};render()}
  if(w){wk=Number(w.dataset.wk);render()}};
$("#addform").onsubmit=async e=>{
  e.preventDefault();if(!db)return;const ch=$("#addch").value,client=norm($("#addname").value),t=parseInt($("#addtarget").value,10);if(!client||!(t>0))return;
  const ex=items.find(i=>i.ch===ch&&i.client===client);
  try{if(ex){await db.doc("items/"+ex.id).update({target:ex.target+t,by:me,updatedAt:Date.now()});toast(`${client} ${CHN[ch]} 목표 ${ex.target+t}건으로 늘렸습니다`)}
    else{await db.doc(`items/${month}_${ch}_${Date.now().toString(36)}`).set({month,ch,client,target:t,done:0,owner:me,by:me,updatedAt:Date.now()});toast(`${client} ${CHN[ch]} 추가했습니다`)}
    $("#addname").value="";$("#addtarget").value=1;
  }catch(err){fail(err)}
};
async function genMonth(m=month){
  if(!db)return;let n=0;
  try{
    const [prev,cur]=await Promise.all([db.collection("items").where("month","==",shiftMonth(m,-1)).get(),db.collection("items").where("month","==",m).get()]);
    const plan={};prev.docs.forEach(d=>{const x=d.data();plan[x.client+"|"+x.ch]={client:x.client,ch:x.ch,target:x.target,owner:x.owner||""}});
    Object.values(contracts).forEach(c=>{if(!c.name)return;Object.values(plan).forEach(p=>{if(p.client===c.name&&c.owner)p.owner=c.owner});
      Object.entries(c.plan||{}).forEach(([k,v])=>{if(v>0)plan[c.name+"|"+k]={client:c.name,ch:k,target:v,owner:c.owner||plan[c.name+"|"+k]?.owner||""}})});
    const have=new Set(cur.docs.map(d=>{const x=d.data();return x.client+"|"+x.ch}));
    const todo=Object.values(plan).filter(p=>!have.has(p.client+"|"+p.ch));
    if(!todo.length)return toast(Object.keys(plan).length?`${Number(m.slice(5))}월 목록이 이미 다 있어요`:"지난달 목록도, 계약 정보도 없습니다");
    for(const p of todo){await db.doc(`items/${m}_${p.ch}_${cid(p.client).slice(2,34)}`).set({month:m,ch:p.ch,client:p.client,target:p.target,done:0,owner:p.owner,by:me,updatedAt:Date.now()});n++}
    toast(`${Number(m.slice(5))}월 작업 ${n}개를 만들었습니다`);
  }catch(err){fail(err)}
}
async function loadHist(){
  if(!db)return;for(const mm of[shiftMonth(month,-2),shiftMonth(month,-1)]){if(hist[mm])continue;hist[mm]=[];
    try{const s=await db.collection("items").where("month","==",mm).get();hist[mm]=s.docs.map(d=>d.data());if(view==="client")renderClient($("#main"))}catch(_){}}
}
function subscribe(){
  unsub.forEach(u=>u());unsub=[];loaded=false;logsReady=false;items=[];logs=[];adlogs=[];openId=null;lastLog=null;render();if(!db)return;
  $("#status").textContent="불러오는 중…";const timer=setTimeout(()=>{$("#status").textContent="서버 응답이 늦습니다. 보이는 내용이 최신이 아닐 수 있어요"},10000);
  unsub.push(db.collection("items").where("month","==",month).onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));loaded=true;if(!s.metadata.fromCache){clearTimeout(timer);$("#status").textContent="실시간 연결됨"}render()},()=>{clearTimeout(timer);loaded=true;$("#status").textContent="목록을 불러오지 못했습니다";render()}));
  unsub.push(db.collection("adlogs").where("month","==",month).onSnapshot(s=>{adlogs=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));
  let first=true;
  unsub.push(db.collection("logs").where("month","==",month).onSnapshot(s=>{logs=s.docs.map(d=>({id:d.id,...d.data()}));logsReady=true;render();if(first&&!s.metadata.fromCache){first=false;dailyCheer();setTimeout(checkNotice,1500)}},()=>{}));
}
render();
(async()=>{
  const user=await window.claude?.use?.("user").catch?.(()=>null) ?? null;
  try{IS_OWNER=!!(user&&await user.isOwner())}catch(_){IS_OWNER=false}
  if(!IS_OWNER&&me==="대표")me=STAFF[0][0];
  meKey="";fillMe();
  db=await window.claude?.use?.("db").catch?.(()=>null) ?? null;
  if(!db){$("#status").textContent="로그인한 상태에서 열어야 기록할 수 있어요";loaded=true;render();return}
  db.collection("clients").onSnapshot(s=>{clients={};s.docs.forEach(d=>clients[d.id]=d.data());render()},()=>{});
  db.doc("settings/team").onSnapshot(s=>{nickDoc=s.exists?s.data():{};mergeTeam()},()=>{});
  db.doc("admin/team").onSnapshot(s=>{adminDoc=s.exists?s.data():{};mergeTeam()},()=>{});
  if(IS_OWNER)db.doc("admin/contracts").onSnapshot(s=>{contracts=s.exists?(s.data().list||{}):{};render()},()=>{});
  db.collection("tasks").onSnapshot(s=>{tasks=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  db.collection("ads").onSnapshot(s=>{ads=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  db.doc("settings/off").onSnapshot(s=>{off=s.exists?{company:{},staff:{},...s.data()}:{company:{},staff:{}};render()},()=>{});
  subscribe();
})();
</script>
